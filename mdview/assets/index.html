<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mdview · 报告预览</title>
<link id="css-md-light" rel="stylesheet" href="/static/md-light.css">
<link id="css-md-dark" rel="stylesheet" href="/static/md-dark.css" disabled>
<link id="css-hl-light" rel="stylesheet" href="/static/hl-light.css">
<link id="css-hl-dark" rel="stylesheet" href="/static/hl-dark.css" disabled>
<style>
  :root { --bg:#f6f8fa; --panel:#fff; --border:#d0d7de; --fg:#1f2328; --fg-dim:#656d76; --accent:#0969da; --hover:#eaeef2; --active:#ddf4ff; }
  html.dark { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --fg-dim:#7d8590; --accent:#4493f8; --hover:#21262d; --active:#1f2f3f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; }
  .logo { font-weight:700; font-size:15px; white-space:nowrap; }
  .logo span { color:var(--accent); }
  #breadcrumbs { display:flex; flex-wrap:wrap; align-items:center; gap:2px; font-size:13px; overflow:hidden; flex:1; }
  #breadcrumbs a { color:var(--accent); text-decoration:none; padding:2px 4px; border-radius:4px; }
  #breadcrumbs a:hover { background:var(--hover); }
  #breadcrumbs .sep { color:var(--fg-dim); }
  #breadcrumbs .cur { color:var(--fg); font-weight:600; }
  .hbtn { border:1px solid var(--border); background:var(--panel); color:var(--fg); border-radius:6px; padding:4px 9px; cursor:pointer; font-size:13px; flex-shrink:0; }
  .hbtn:hover { background:var(--hover); }
  .hbtn.on { background:var(--active); color:var(--accent); border-color:var(--accent); }
  main { display:flex; flex:1; overflow:hidden; }
  #sidebar { width:310px; min-width:310px; background:var(--panel); display:flex; flex-direction:column; overflow:hidden; }
  #search-row { display:flex; gap:6px; padding:8px; border-bottom:1px solid var(--border); flex-shrink:0; }
  #search-input { flex:1; padding:5px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg); font-size:13px; outline:none; }
  #search-input:focus { border-color:var(--accent); }
  #search-clear { display:none; }
  #tree-wrap, #results-wrap { flex:1; overflow:auto; padding:6px 4px; font-size:13.5px; }
  #sidebar ul { list-style:none; }
  #sidebar li ul { padding-left:16px; }
  .row { display:flex; align-items:center; gap:6px; padding:3px 8px; border-radius:6px; cursor:pointer; white-space:nowrap; min-width:max-content; user-select:none; }
  .row:hover { background:var(--hover); }
  .row.active { background:var(--active); color:var(--accent); font-weight:600; }
  .row .icon { flex-shrink:0; width:18px; text-align:center; }
  .row .name { flex:1 0 auto; }
  .row .meta { color:var(--fg-dim); font-size:11px; flex-shrink:0; }
  .row .arrow { color:var(--fg-dim); font-size:10px; width:12px; flex-shrink:0; }
  .result-head { padding:6px 10px; font-size:12px; color:var(--fg-dim); border-bottom:1px dashed var(--border); margin-bottom:4px; }
  .result-line { color:var(--fg-dim); font-size:11.5px; padding-left:24px; padding-right:10px; min-width:max-content; white-space:nowrap; }
  #content { flex:1; min-width:0; overflow-y:auto; }
  .panel-resizer { flex:0 0 6px; position:relative; cursor:col-resize; touch-action:none; outline:none; }
  .panel-resizer::after { content:""; position:absolute; top:0; bottom:0; left:2px; width:1px; background:var(--border); transition:background .15s,width .15s,left .15s; }
  .panel-resizer:hover::after, .panel-resizer.dragging::after, .panel-resizer:focus-visible::after { left:1px; width:3px; background:var(--accent); }
  body.panel-resizing, body.panel-resizing * { cursor:col-resize !important; user-select:none !important; }
  .markdown-body { max-width:880px; margin:0 auto; padding:32px 44px 96px; font-size:15.5px; line-height:1.75; }
  html.dark .markdown-body { color-scheme:dark; }
  body.wide .markdown-body, body.wide .plaintext, body.wide .imgview { max-width:none; }
  .plaintext { max-width:880px; margin:0 auto; padding:32px 44px; font-family:ui-monospace,"JetBrains Mono",Consolas,monospace; font-size:13px; white-space:pre-wrap; word-break:break-all; }
  .imgview { max-width:880px; margin:0 auto; padding:32px; text-align:center; }
  .imgview img { max-width:100%; border:1px solid var(--border); border-radius:8px; }
  .welcome { max-width:700px; margin:56px auto; padding:0 32px; color:var(--fg-dim); line-height:2; }
  .welcome h2 { color:var(--fg); margin-bottom:12px; }
  .welcome code { background:var(--hover); padding:2px 6px; border-radius:4px; font-size:13px; }
  .error-box { max-width:700px; margin:56px auto; padding:24px; border:1px solid var(--border); border-radius:8px; color:#cf222e; background:var(--panel); line-height:1.8; }
  #toc { display:none; width:230px; min-width:230px; overflow-y:auto; padding:14px 10px; background:var(--panel); font-size:13px; }
  #toc.show { display:block; }
  #toc .toc-title { font-size:12px; color:var(--fg-dim); padding:0 8px 8px; }
  #toc ul { list-style:none; }
  #toc a { display:block; padding:3px 8px; color:var(--fg-dim); text-decoration:none; border-left:2px solid var(--border); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #toc a:hover { color:var(--fg); }
  #toc a.active { color:var(--accent); border-left-color:var(--accent); font-weight:600; }
  #toc a.lv2 { padding-left:22px; }
  #toc a.lv3 { padding-left:36px; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:5px; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>
<header>
  <div class="logo">📖 <span>mdview</span></div>
  <nav id="breadcrumbs"></nav>
  <button class="hbtn" id="width-btn" title="切换窄版心/宽屏排版">⇔ 宽屏</button>
  <button class="hbtn on" id="toc-btn" title="显示/隐藏大纲">📑 大纲</button>
  <button class="hbtn" id="theme-btn" title="切换明暗主题">🌙</button>
</header>
<main>
  <aside id="sidebar">
    <div id="search-row">
      <input id="search-input" placeholder="🔍 搜索文件名和内容，回车" />
      <button class="hbtn" id="search-clear" title="清除搜索">✕</button>
    </div>
    <div id="tree-wrap"></div>
    <div id="results-wrap" style="display:none"></div>
  </aside>
  <div class="panel-resizer" id="sidebar-resizer" role="separator" aria-label="调整左栏宽度" aria-orientation="vertical" aria-valuemin="180" tabindex="0" title="拖拽调整左栏宽度；双击恢复默认；方向键微调"></div>
  <div id="content">
    <div class="welcome">
      <h2>👋 欢迎使用 mdview</h2>
      <p>在左侧浏览文件，点击 <code>.md</code> 文件即可渲染预览。</p>
      <p>支持：Markdown 渲染 · 代码高亮 · 全文搜索 · 大纲导航 · 宽窄排版 · 明暗主题</p>
    </div>
  </div>
  <div class="panel-resizer" id="toc-resizer" role="separator" aria-label="调整右栏宽度" aria-orientation="vertical" aria-valuemin="160" tabindex="0" title="拖拽调整右栏宽度；双击恢复默认；方向键微调"></div>
  <aside id="toc" class="show"></aside>
</main>
<script src="/static/marked.min.js"></script>
<script src="/static/highlight.min.js"></script>
<script>
(function () {
  "use strict";
  const TOKEN = "__MDVIEW_TOKEN__";
  const qs = (o) => Object.entries(o).map(([k,v]) => k + "=" + encodeURIComponent(v)).join("&");
  async function api(path, params) {
    const url = path + (params ? "?" + qs(params) : "");
    const r = await fetch(url, { headers: TOKEN ? { "Authorization": "Bearer " + TOKEN } : {} });
    if (!r.ok) throw new Error((await r.text()) || ("HTTP " + r.status));
    const ct = r.headers.get("Content-Type") || "";
    return ct.includes("json") ? r.json() : r.text();
  }
  const rawUrl = (path) => "/api/raw?" + qs({ path, token: TOKEN });

  const sidebar = document.getElementById("sidebar");
  const treeWrap = document.getElementById("tree-wrap");
  const resultsWrap = document.getElementById("results-wrap");
  const content = document.getElementById("content");
  const breadcrumbs = document.getElementById("breadcrumbs");
  const tocEl = document.getElementById("toc");
  const sidebarResizer = document.getElementById("sidebar-resizer");
  const tocResizer = document.getElementById("toc-resizer");
  const searchInput = document.getElementById("search-input");
  const searchClear = document.getElementById("search-clear");
  let currentFile = null;

  marked.setOptions({ gfm: true, breaks: false });

  /* 主题 */
  const stylePairs = [["css-md-light","css-md-dark"],["css-hl-light","css-hl-dark"]];
  const themeBtn = document.getElementById("theme-btn");
  function setTheme(dark) {
    document.documentElement.classList.toggle("dark", dark);
    stylePairs.forEach(([l,d]) => {
      document.getElementById(l).disabled = dark;
      document.getElementById(d).disabled = !dark;
    });
    themeBtn.textContent = dark ? "☀️" : "🌙";
    localStorage.setItem("mdview-theme", dark ? "dark" : "light");
  }
  themeBtn.onclick = () => setTheme(!document.documentElement.classList.contains("dark"));

  /* 宽屏 */
  const widthBtn = document.getElementById("width-btn");
  function applyWide(w) {
    document.body.classList.toggle("wide", w);
    widthBtn.classList.toggle("on", w);
    widthBtn.textContent = w ? "⇥ 窄版" : "⇔ 宽屏";
    localStorage.setItem("mdview-wide", w ? "1" : "0");
  }
  widthBtn.onclick = () => applyWide(!document.body.classList.contains("wide"));
  applyWide(localStorage.getItem("mdview-wide") === "1");

  /* 大纲显隐 */
  const tocBtn = document.getElementById("toc-btn");
  function applyTocVisible(v) {
    tocEl.classList.toggle("show", v);
    tocResizer.style.display = v ? "" : "none";
    tocBtn.classList.toggle("on", v);
    localStorage.setItem("mdview-toc", v ? "1" : "0");
  }
  tocBtn.onclick = () => applyTocVisible(!tocEl.classList.contains("show"));

  /* 左右栏拖拽调宽：保存宽度，双击恢复默认，方向键微调 */
  function initPanelResizers() {
    const main = document.querySelector("main");
    const configs = [
      { panel:sidebar, handle:sidebarResizer, key:"mdview-sidebar-width", def:310, min:180, max:640, sign:1,
        other:() => tocEl.classList.contains("show") ? tocEl.offsetWidth : 0 },
      { panel:tocEl, handle:tocResizer, key:"mdview-toc-width", def:230, min:160, max:480, sign:-1,
        other:() => sidebar.offsetWidth },
    ];
    const refreshes = configs.map((cfg) => {
      let width = cfg.def;
      function apply(value, persist) {
        const available = main.clientWidth - cfg.other() - 252; /* 正文至少 240px + 两条分隔条 */
        const upper = Math.max(cfg.min, Math.min(cfg.max, available));
        width = Math.round(Math.max(cfg.min, Math.min(upper, value)));
        cfg.panel.style.width = width + "px";
        cfg.panel.style.minWidth = width + "px";
        cfg.handle.setAttribute("aria-valuenow", width);
        cfg.handle.setAttribute("aria-valuemax", upper);
        if (persist) localStorage.setItem(cfg.key, String(width));
      }
      const saved = parseInt(localStorage.getItem(cfg.key) || "", 10);
      apply(Number.isFinite(saved) ? saved : cfg.def);
      cfg.handle.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        const startX = e.clientX, startWidth = width;
        cfg.handle.setPointerCapture(e.pointerId);
        cfg.handle.classList.add("dragging");
        document.body.classList.add("panel-resizing");
        const move = (ev) => apply(startWidth + cfg.sign * (ev.clientX - startX));
        const stop = () => {
          cfg.handle.removeEventListener("pointermove", move);
          cfg.handle.removeEventListener("pointerup", stop);
          cfg.handle.removeEventListener("pointercancel", stop);
          cfg.handle.classList.remove("dragging");
          document.body.classList.remove("panel-resizing");
          localStorage.setItem(cfg.key, String(width));
        };
        cfg.handle.addEventListener("pointermove", move);
        cfg.handle.addEventListener("pointerup", stop);
        cfg.handle.addEventListener("pointercancel", stop);
      });
      cfg.handle.addEventListener("dblclick", () => apply(cfg.def, true));
      cfg.handle.addEventListener("keydown", (e) => {
        const direction = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0;
        if (!direction) return;
        e.preventDefault();
        apply(width + cfg.sign * direction * (e.shiftKey ? 48 : 16), true);
      });
      return () => apply(width);
    });
    window.addEventListener("resize", () => refreshes.forEach((refresh) => refresh()));
  }
  initPanelResizers();

  /* 工具 */
  const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const fmtSize = (n) => n < 1024 ? n+"B" : n < 1048576 ? (n/1024).toFixed(1)+"K" : (n/1048576).toFixed(1)+"M";
  const ICONS = { md:"📝", markdown:"📝", go:"🐹", rs:"🦀", py:"🐍", js:"📜", ts:"📜", json:"🧾",
    yml:"⚙️", yaml:"⚙️", toml:"⚙️", sh:"⚡", png:"🖼️", jpg:"🖼️", jpeg:"🖼️", gif:"🖼️", svg:"🖼️", webp:"🖼️",
    pdf:"📕", zip:"📦", html:"🌐", css:"🎨" };
  const isImg = (ext) => ["png","jpg","jpeg","gif","svg","webp"].includes(ext);
  const iconOf = (e) => e.isDir ? "📁" : (ICONS[e.ext] || "📄");

  function resolvePath(fromFile, href) {
    href = href.split("#")[0].split("?")[0];
    if (!href) return fromFile;
    const parts = fromFile.split("/"); parts.pop();
    href.split("/").forEach((seg) => {
      if (seg === "" || seg === ".") return;
      if (seg === "..") parts.pop(); else parts.push(seg);
    });
    return parts.join("/");
  }

  /* 文件树 */
  function buildUl(entries) {
    const ul = document.createElement("ul");
    entries.forEach((e) => {
      const li = document.createElement("li");
      const row = document.createElement("div");
      row.className = "row"; row.dataset.path = e.path;
      const arrow = e.isDir ? '<span class="arrow">▸</span>' : '<span class="arrow"></span>';
      const meta = e.isDir ? "" : `<span class="meta">${fmtSize(e.size)}</span>`;
      row.innerHTML = `${arrow}<span class="icon">${iconOf(e)}</span><span class="name" title="${esc(e.name)}">${esc(e.name)}</span>${meta}`;
      li.appendChild(row);
      if (e.isDir) {
        const child = document.createElement("ul");
        child.style.display = "none"; child.dataset.loaded = ""; child.dataset.path = e.path;
        li.appendChild(child);
        row.onclick = () => toggleDir(row, child);
      } else {
        row.onclick = () => openFile(e.path, e.ext);
      }
      ul.appendChild(li);
    });
    return ul;
  }

  async function toggleDir(row, childUl, forceOpen) {
    const open = childUl.style.display !== "none";
    if (open && !forceOpen) {
      childUl.style.display = "none";
      row.querySelector(".arrow").textContent = "▸";
      return;
    }
    if (!childUl.dataset.loaded) {
      try { childUl.appendChild(buildUl(await api("/api/tree", { path: childUl.dataset.path }))); }
      catch (e) { showError(e.message); return; }
      childUl.dataset.loaded = "1";
    }
    childUl.style.display = "";
    row.querySelector(".arrow").textContent = "▾";
  }

  async function expandTo(dirRel) {
    const parts = dirRel ? dirRel.split("/") : [];
    let scope = treeWrap, rel = "";
    for (const part of parts) {
      rel = rel ? rel + "/" + part : part;
      const row = scope.querySelector('.row[data-path="' + CSS.escape(rel) + '"]');
      if (!row) return;
      const childUl = row.parentElement.querySelector(":scope > ul");
      if (childUl) { await toggleDir(row, childUl, true); scope = childUl; }
    }
  }

  /* 文件渲染 */
  function highlightActiveRow(path) {
    sidebar.querySelectorAll(".row.active").forEach((r) => r.classList.remove("active"));
    const row = sidebar.querySelector('.row[data-path="' + CSS.escape(path) + '"]');
    if (row) { row.classList.add("active"); row.scrollIntoView({ block: "nearest" }); }
  }

  async function openFile(path, ext) {
    currentFile = path;
    renderCrumbs(path);
    highlightActiveRow(path);
    ext = ext || path.split(".").pop().toLowerCase();
    if (isImg(ext)) {
      content.innerHTML = `<div class="imgview"><img src="${rawUrl(path)}" alt="${esc(path)}"></div>`;
      tocEl.innerHTML = "";
      return;
    }
    let text;
    try { text = await api("/api/file", { path }); }
    catch (e) { showError("无法读取 " + path + "：" + e.message); return; }

    if (/\.(md|markdown)$/i.test(path)) {
      content.innerHTML = '<article class="markdown-body">' + marked.parse(text) + "</article>";
      const article = content.querySelector("article");
      article.querySelectorAll("pre code").forEach((b) => { try { hljs.highlightElement(b); } catch(_){} });
      article.querySelectorAll("img").forEach((img) => {
        const src = img.getAttribute("src");
        if (src && !/^(https?:|data:|\/)/.test(src)) img.src = rawUrl(resolvePath(path, src));
      });
      article.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
      buildToc(article);
    } else {
      content.innerHTML = '<pre class="plaintext">' + esc(text) + "</pre>";
      tocEl.innerHTML = "";
    }
    content.scrollTop = 0;
    history.replaceState(null, "", "?p=" + encodeURIComponent(path));
  }

  content.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a || !currentFile) return;
    const href = a.getAttribute("href") || "";
    if (/^(https?:|#|mailto:)/.test(href)) return;
    e.preventDefault();
    const target = resolvePath(currentFile, href);
    expandTo(target.split("/").slice(0,-1).join("/")).then(() => openFile(target, null));
  });

  /* 大纲 */
  function buildToc(article) {
    const heads = article.querySelectorAll("h1, h2, h3");
    tocEl.innerHTML = "";
    if (!heads.length) return;
    tocEl.innerHTML = '<div class="toc-title">大纲</div>';
    const ul = document.createElement("ul");
    heads.forEach((h, i) => {
      const id = "toc-h-" + i; h.id = id;
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.textContent = h.textContent;
      a.dataset.target = id;
      a.className = "lv" + h.tagName[1];
      a.title = h.textContent;
      a.onclick = () => document.getElementById(id).scrollIntoView({ behavior: "smooth" });
      li.appendChild(a); ul.appendChild(li);
    });
    tocEl.appendChild(ul);
    const obs = new IntersectionObserver((es) => {
      es.forEach((en) => {
        if (en.isIntersecting) {
          tocEl.querySelectorAll("a").forEach((a) => a.classList.toggle("active", a.dataset.target === en.target.id));
        }
      });
    }, { root: content, rootMargin: "0px 0px -75% 0px" });
    heads.forEach((h) => obs.observe(h));
  }

  /* 面包屑 */
  function renderCrumbs(path) {
    const parts = path.split("/");
    let html = '<a data-dir="">🏠</a>', rel = "";
    parts.forEach((p, i) => {
      rel = rel ? rel + "/" + p : p;
      html += '<span class="sep">/</span>' + (i === parts.length - 1
        ? `<span class="cur">${esc(p)}</span>`
        : `<a data-dir="${esc(rel)}">${esc(p)}</a>`);
    });
    breadcrumbs.innerHTML = html;
    breadcrumbs.querySelectorAll("a").forEach((a) => { a.onclick = () => expandTo(a.dataset.dir); });
  }

  /* 搜索 */
  async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;
    resultsWrap.innerHTML = '<div class="result-head">搜索中…</div>';
    treeWrap.style.display = "none";
    resultsWrap.style.display = "";
    searchClear.style.display = "";
    let results;
    try { results = await api("/api/search", { q }); }
    catch (e) { resultsWrap.innerHTML = `<div class="result-head">⚠️ ${esc(e.message)}</div>`; return; }
    if (!results.length) { resultsWrap.innerHTML = '<div class="result-head">无结果</div>'; return; }
    resultsWrap.innerHTML = `<div class="result-head">“${esc(q)}” 共 ${results.length} 条</div>`;
    const ul = document.createElement("ul");
    results.forEach((r) => {
      const li = document.createElement("li");
      const row = document.createElement("div");
      row.className = "row";
      const fname = r.path.split("/").pop();
      row.innerHTML = r.name
        ? `<span class="arrow"></span><span class="icon">📝</span><span class="name" title="${esc(r.path)}">${esc(fname)}</span>`
        : `<span class="arrow"></span><span class="icon">🅻${r.line}</span><span class="name" title="${esc(r.path)}">${esc(fname)}</span>`;
      li.appendChild(row);
      if (!r.name && r.text) {
        const line = document.createElement("div");
        line.className = "result-line";
        line.textContent = r.text;
        li.appendChild(line);
      }
      row.onclick = () => {
        clearSearch();
        expandTo(r.path.split("/").slice(0,-1).join("/")).then(() => openFile(r.path, null));
      };
      ul.appendChild(li);
    });
    resultsWrap.appendChild(ul);
  }
  function clearSearch() {
    searchInput.value = "";
    searchClear.style.display = "none";
    resultsWrap.style.display = "none";
    treeWrap.style.display = "";
  }
  searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
  searchClear.onclick = clearSearch;

  function showError(msg) {
    content.innerHTML = `<div class="error-box">⚠️ ${esc(msg)}</div>`;
  }

  /* 启动 */
  (async function init() {
    setTheme(localStorage.getItem("mdview-theme")
      ? localStorage.getItem("mdview-theme") === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches);
    applyTocVisible(localStorage.getItem("mdview-toc") !== "0");
    try { treeWrap.appendChild(buildUl(await api("/api/tree", { path: "" }))); }
    catch (e) { showError("服务连接失败：" + e.message); return; }
    const p = new URLSearchParams(location.search).get("p");
    if (p) {
      await expandTo(p.split("/").slice(0,-1).join("/"));
      openFile(p, null);
    }
  })();
})();
</script>
